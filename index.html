<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Il Mio Ricettario 🍳</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Nunito', sans-serif; background-color: #FFFBEB; }
    h1, h2, h3, .font-fun { font-family: 'Fredoka', cursive; }
    .bg-amber-custom { background-color: #F59E0B; }
    @media print {
      body { background-color: white; color: black; }
      .no-print { display: none !important; }
      .print-modal-container { position: absolute; top: 0; left: 0; width: 100%; height: auto; background: white; z-index: 9999; }
    }
  </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col">

  <header class="no-print bg-amber-500 text-white p-6 shadow-md text-center">
    <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
      <h1 class="text-3xl md:text-4xl font-fun tracking-wide flex items-center gap-2">
        <span>🍳</span> Il Ricettario di Martina
      </h1>
      <button onclick="toggleModal('add-modal')" class="bg-white text-amber-600 font-bold px-5 py-2.5 rounded-full shadow hover:bg-amber-50 transition">
        ✏️ Nuova Ricetta
      </button>
    </div>
  </header>

  <nav class="no-print bg-amber-100 p-4 shadow-inner border-b border-amber-200 sticky top-0 z-20">
    <div class="max-w-5xl mx-auto flex flex-wrap justify-center gap-2 text-sm font-semibold">
      <button onclick="filterCategory('tutte')" class="px-4 py-2 rounded-full bg-amber-500 text-white shadow hover:bg-amber-600">Tutte</button>
      <button onclick="filterCategory('Antipasti e Aperitivi')" class="px-4 py-2 rounded-full bg-white text-amber-800 hover:bg-amber-200">Antipasti e Aperitivi</button>
      <button onclick="filterCategory('Primi Piatti')" class="px-4 py-2 rounded-full bg-white text-amber-800 hover:bg-amber-200">Primi Piatti</button>
      <button onclick="filterCategory('Secondi Piatti')" class="px-4 py-2 rounded-full bg-white text-amber-800 hover:bg-amber-200">Secondi Piatti</button>
      <button onclick="filterCategory('Contorni')" class="px-4 py-2 rounded-full bg-white text-amber-800 hover:bg-amber-200">Contorni</button>
      <button onclick="filterCategory('Pizza, Pane e Focacce')" class="px-4 py-2 rounded-full bg-white text-amber-800 hover:bg-amber-200">Pizza, Pane e Focacce</button>
      <button onclick="filterCategory('Dolci')" class="px-4 py-2 rounded-full bg-white text-amber-800 hover:bg-amber-200">Dolci</button>
      <button onclick="filterCategory('Altro')" class="px-4 py-2 rounded-full bg-white text-amber-800 hover:bg-amber-200">Altro</button>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto p-6 flex-grow">
    <div id="recipes-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <p class="text-center text-gray-500 col-span-full py-10">Caricamento delle ricette in corso...</p>
    </div>
  </main>

  <!-- Modal Aggiungi Ricetta -->
  <div id="add-modal" class="no-print hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white p-6 md:p-8 rounded-2xl max-w-xl w-full max-h-[90vh] overflow-y-auto relative shadow-2xl">
      <button onclick="toggleModal('add-modal')" class="absolute top-4 right-4 text-gray-400 hover:text-black text-xl font-bold">✖</button>
      
      <h2 class="text-2xl font-fun text-amber-600 mb-4">Aggiungi o Importa Ricetta</h2>

      <!-- Campo Importazione da Link -->
      <div class="bg-amber-50 p-4 rounded-xl border border-amber-200 mb-6">
        <label class="block text-xs font-bold text-amber-800 uppercase mb-1">🔗 Incolla Link (Sito Web, Instagram, TikTok)</label>
        <div class="flex gap-2">
          <input type="url" id="import-url" placeholder="https://www.giallozafferano.it/..." class="w-full p-2 text-sm rounded-lg border border-amber-300 focus:outline-none bg-white">
          <button type="button" onclick="importFromUrl()" class="bg-amber-500 text-white font-bold px-4 text-sm rounded-lg hover:bg-amber-600 whitespace-nowrap py-2 transition">
            Importa
          </button>
        </div>
      </div>
      
      <form id="recipe-form" onsubmit="saveRecipe(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase">Titolo Ricetta *</label>
          <input type="text" id="f-titolo" required class="w-full p-2 border rounded-lg">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase">Categoria *</label>
            <select id="f-categoria" required class="w-full border rounded-xl p-3 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
              <option value="Antipasti e Aperitivi">Antipasti e Aperitivi</option>
              <option value="Primi Piatti">Primi Piatti</option>
              <option value="Secondi Piatti">Secondi Piatti</option>
              <option value="Contorni">Contorni</option>
              <option value="Pizza, Pane e Focacce">Pizza, Pane e Focacce</option>
              <option value="Dolci">Dolci</option>
              <option value="Altro">Altro</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase">Tempo di Preparazione</label>
            <input type="text" id="f-tempo" placeholder="es. 30 minuti" class="w-full p-2 border rounded-lg">
          </div>
        </div>
        
        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Immagine Ricetta</label>
          <input type="file" id="f-file-immagine" accept="image/*" class="mb-2 text-xs w-full text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100">
          <p class="text-[10px] text-gray-400 font-bold mb-1">OPPURE INCOLLA URL IMMAGINE:</p>
          <input type="url" id="f-immagine" placeholder="https://..." class="w-full p-2 border rounded-lg">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase">Ingredienti</label>
          <textarea id="f-ingredienti" rows="3" placeholder="Un ingrediente per riga..." class="w-full p-2 border rounded-lg"></textarea>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase">Preparazione / Passaggi</label>
          <textarea id="f-preparazione" rows="4" placeholder="Spiega come prepararla..." class="w-full p-2 border rounded-lg"></textarea>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase">Note Aggiuntive</label>
          <textarea id="f-note" rows="2" placeholder="Consigli, varianti, conservazione..." class="w-full p-2 border rounded-lg"></textarea>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase">Fonte (Link originale)</label>
          <input type="url" id="f-fonte" placeholder="https://..." class="w-full p-2 border rounded-lg">
        </div>

        <button type="submit" class="w-full bg-amber-500 text-white font-bold py-3 rounded-xl shadow hover:bg-amber-600 transition">Salva nel Ricettario 📖</button>
      </form>
    </div>
  </div>

  <!-- Modal Visualizza Ricetta -->
  <div id="view-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50 print-modal-container">
    <div class="bg-white p-6 md:p-8 rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto relative shadow-2xl">
      <button onclick="toggleModal('view-modal')" class="no-print absolute top-4 right-4 text-gray-400 hover:text-black text-xl font-bold">✖</button>
      <div id="view-content" class="space-y-6"></div>
    </div>
  </div>

  <!-- Modal Modifica Ricetta -->
  <div id="edit-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 max-h-[90vh] overflow-y-auto shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold font-fun text-amber-800">✏️ Modifica Ricetta</h2>
        <button onclick="toggleModal('edit-modal')" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
      </div>

      <form id="edit-recipe-form" onsubmit="updateRecipe(event)" class="space-y-4">
        <input type="hidden" id="edit-id">
        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Titolo Ricetta *</label>
          <input type="text" id="edit-titolo" required class="w-full border rounded-xl p-3 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
        </div>
        
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Categoria *</label>
            <select id="edit-categoria" required class="w-full border rounded-xl p-3 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
              <option value="Antipasti e Aperitivi">Antipasti e Aperitivi</option>
              <option value="Primi Piatti">Primi Piatti</option>
              <option value="Secondi Piatti">Secondi Piatti</option>
              <option value="Contorni">Contorni</option>
              <option value="Pizza, Pane e Focacce">Pizza, Pane e Focacce</option>
              <option value="Dolci">Dolci</option>
              <option value="Altro">Altro</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Tempo di prep.</label>
            <input type="text" id="edit-tempo" class="w-full border rounded-xl p-3 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Immagine Ricetta</label>
          <input type="file" id="edit-file-immagine" accept="image/*" class="mb-2 text-xs w-full text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100">
          <p class="text-[10px] text-gray-400 font-bold mb-1">OPPURE INCOLLA URL IMMAGINE:</p>
          <input type="url" id="edit-immagine" class="w-full border rounded-xl p-3 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Ingredienti</label>
          <textarea id="edit-ingredienti" rows="3" class="w-full border rounded-xl p-3 text-sm focus:ring-2 focus:ring-amber-500 outline-none"></textarea>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Preparazione</label>
          <textarea id="edit-preparazione" rows="4" class="w-full border rounded-xl p-3 text-sm focus:ring-2 focus:ring-amber-500 outline-none"></textarea>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Note</label>
          <textarea id="edit-note" rows="2" class="w-full border rounded-xl p-3 text-sm focus:ring-2 focus:ring-amber-500 outline-none"></textarea>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Link Fonte / Sitoweb</label>
          <input type="url" id="edit-fonte" class="w-full border rounded-xl p-3 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
        </div>

        <button type="submit" class="w-full bg-amber-500 text-white font-bold p-3 rounded-xl hover:bg-amber-600 transition shadow-md mt-4">
          💾 Salva Modifiche
        </button>
      </form>
    </div>
  </div>

  <footer class="no-print text-center py-6 text-xs text-amber-700">
    🍰 Il Mio Ricettario Personale
  </footer>

  <script>
    // Configurazione Supabase
    const SUPABASE_URL = 'https://zglusunjhvomtlyxpvof.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpnbHVzdW5qaHZvbXRseXhwdm9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4OTY2NDYsImV4cCI6MjEwNTQ3MjY0Nn0.fX_mMqktm2HluRV81fNzO3Qdn6Vn-R9J91TcXyJFWvo';
    
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allRecipes = [];

    // Helper Lettura Immagine da File o URL
    function getImageUrl(fileInputId, urlInputId) {
      return new Promise((resolve) => {
        const fileInput = document.getElementById(fileInputId);
        const urlInput = document.getElementById(urlInputId);

        if (fileInput && fileInput.files && fileInput.files[0]) {
          const reader = new FileReader();
          reader.onload = function(e) { resolve(e.target.result); };
          reader.readAsDataURL(fileInput.files[0]);
        } else if (urlInput && urlInput.value.trim()) {
          resolve(urlInput.value.trim());
        } else {
          resolve('');
        }
      });
    }

    // Importazione automatica da URL
    async function importFromUrl() {
      const urlInput = document.getElementById('import-url');
      if (!urlInput || !urlInput.value.trim()) {
        alert("Inserisci un link valido!");
        return;
      }

      const url = urlInput.value.trim();
      const btn = event.target;
      const originalText = btn.innerText;
      btn.innerText = "⏳ Importazione in corso...";
      btn.disabled = true;

      try {
        const res = await fetch(`https://api.microlink.io?url=${encodeURIComponent(url)}&prerender=true`);
        const json = await res.json();

        if (json.status === 'success' && json.data) {
          const d = json.data;

          if (d.title) document.getElementById('f-titolo').value = d.title;
          if (d.image && d.image.url) document.getElementById('f-immagine').value = d.image.url;
          document.getElementById('f-fonte').value = url;
          if (d.description) document.getElementById('f-preparazione').value = d.description;

          if (d.description && d.description.includes('Ingredienti')) {
            const parti = d.description.split(/Preparazione|Procedimento/i);
            if (parti.length > 1) {
              document.getElementById('f-ingredienti').value = parti[0].replace(/Ingredienti:?/i, '').trim();
              document.getElementById('f-preparazione').value = parti[1].trim();
            }
          }

          alert("✨ Dati estratti con successo! Controlla e integra ingredienti e preparazione se necessario prima di salvare.");
        } else {
          alert("Impossibile estrarre automaticamente i dettagli da questo link. Inserisci i dati manualmente.");
        }
      } catch (err) {
        console.error("Errore importazione:", err);
        alert("Errore durante il collegamento al link. Compila i dati manualmente.");
      } finally {
        btn.innerText = originalText;
        btn.disabled = false;
      }
    }

    // Caricamento ricette
    async function fetchRecipes() {
      const { data, error } = await db.from('ricette').select('*');
      if (error) {
        console.error("Errore caricamento:", error);
        document.getElementById('recipes-grid').innerHTML = `<p class="text-center text-red-500 col-span-full py-10">Errore nel caricamento del database: ${error.message}</p>`;
        return;
      }
      allRecipes = data || [];
      renderRecipes(allRecipes);
    }

    // Rendering schede ricette
    function renderRecipes(recipes) {
      const grid = document.getElementById('recipes-grid');
      if (recipes.length === 0) {
        grid.innerHTML = `<p class="text-center text-gray-500 col-span-full py-10">Nessuna ricetta trovata. Clicca su "✏️ Nuova Ricetta" per aggiungerne una!</p>`;
        return;
      }
      grid.innerHTML = recipes.map(r => `
        <div class="bg-white rounded-2xl shadow-md border border-amber-100 overflow-hidden flex flex-col justify-between hover:shadow-lg transition relative group">
          <div>
            <img src="${r.immagine_url || 'https://images.unsplash.com/photo-1495521821757-a1efb6729352?w=500'}" class="w-full h-48 object-cover">
            <div class="p-5">
              <span class="text-[10px] font-bold text-amber-700 bg-amber-100 px-3 py-1 rounded-full uppercase">${r.categoria || 'Generale'}</span>
              <h3 class="text-xl font-bold font-fun mt-2 text-gray-800">${r.titolo}</h3>
              ${r.tempo ? `<p class="text-xs text-gray-500 mt-1">⏱️ ${r.tempo}</p>` : ''}
            </div>
          </div>
          <div class="p-5 pt-0 flex flex-col gap-2 border-t border-gray-50 mt-4">
            <div class="flex justify-between items-center pt-3">
              ${r.fonte ? `<a href="${r.fonte}" target="_blank" class="text-xs text-amber-600 underline truncate max-w-[100px]">Fonte</a>` : '<span></span>'}
              <button onclick="openRecipe('${r.titolo.replace(/'/g, "\\'")}')" class="bg-amber-500 text-white text-xs px-3 py-2 rounded-lg font-bold hover:bg-amber-600 transition">
                📖 Apri Ricetta
              </button>
            </div>
            <div class="flex gap-2 justify-end pt-1">
              <button onclick="printRecipe('${r.titolo.replace(/'/g, "\\'")}')" class="text-xs bg-amber-50 text-amber-800 hover:bg-amber-100 px-2 py-1 rounded font-semibold transition" title="Stampa">
                🖨️ Stampa
              </button>
              <button onclick="openEditModal('${r.titolo.replace(/'/g, "\\'")}')" class="text-xs bg-gray-100 text-gray-700 hover:bg-amber-100 hover:text-amber-800 px-2 py-1 rounded font-semibold transition" title="Modifica">
                ✏️ Modifica
              </button>
              <button onclick="deleteRecipe('${r.titolo.replace(/'/g, "\\'")}')" class="text-xs bg-red-50 text-red-600 hover:bg-red-100 px-2 py-1 rounded font-semibold transition" title="Elimina">
                🗑️ Elimina
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterCategory(cat) {
      if (cat === 'tutte') renderRecipes(allRecipes);
      else renderRecipes(allRecipes.filter(r => r.categoria === cat));
    }

    function toggleModal(id) {
      document.getElementById(id).classList.toggle('hidden');
    }

    // Salva Nuova Ricetta
    async function saveRecipe(e) {
      e.preventDefault();
      const imgUrl = await getImageUrl('f-file-immagine', 'f-immagine');

      const newRecipe = {
        titolo: document.getElementById('f-titolo').value.trim(),
        categoria: document.getElementById('f-categoria').value,
        tempo: document.getElementById('f-tempo').value,
        immagine_url: imgUrl,
        ingredienti: document.getElementById('f-ingredienti').value,
        preparazione: document.getElementById('f-preparazione').value,
        note: document.getElementById('f-note').value,
        fonte: document.getElementById('f-fonte').value
      };

      const { error } = await db.from('ricette').insert([newRecipe]);
      if (error) {
        alert("Errore durante il salvataggio: " + error.message);
      } else {
        document.getElementById('recipe-form').reset();
        toggleModal('add-modal');
        fetchRecipes();
      }
    }

    // Apri Scheda Ricetta
    function openRecipe(titolo) {
      const r = allRecipes.find(item => item.titolo === titolo);
      if (!r) return;

      document.getElementById('view-content').innerHTML = `
        <div class="text-center">
          <span class="text-xs font-bold text-amber-700 bg-amber-100 px-3 py-1 rounded-full uppercase">${r.categoria || 'Generale'}</span>
          <h2 class="text-3xl font-fun text-gray-800 mt-2">${r.titolo}</h2>
          ${r.tempo ? `<p class="text-sm text-gray-500 mt-1">⏱️ Tempo: ${r.tempo}</p>` : ''}
        </div>
        ${r.immagine_url ? `<img src="${r.immagine_url}" class="w-full h-64 object-cover rounded-xl shadow mt-4">` : ''}
        ${r.ingredienti ? `
          <div class="mt-4">
            <h3 class="text-lg font-bold font-fun text-amber-600 border-b pb-1">🛒 Ingredienti</h3>
            <p class="whitespace-pre-line text-sm mt-2 text-gray-700">${r.ingredienti}</p>
          </div>
        ` : ''}
        ${r.preparazione ? `
          <div class="mt-4">
            <h3 class="text-lg font-bold font-fun text-amber-600 border-b pb-1">👩‍🍳 Preparazione</h3>
            <p class="whitespace-pre-line text-sm mt-2 text-gray-700">${r.preparazione}</p>
          </div>
        ` : ''}
        ${r.note ? `
          <div class="bg-amber-50 p-4 rounded-xl border border-amber-200 mt-4">
            <h3 class="text-sm font-bold text-amber-800">📝 Note</h3>
            <p class="whitespace-pre-line text-sm mt-1 text-amber-900">${r.note}</p>
          </div>
        ` : ''}
        <div class="mt-6 border-t pt-4 flex justify-end gap-3">
          <button onclick="printRecipe('${r.titolo.replace(/'/g, "\\'")}');" class="bg-amber-500 text-white px-4 py-2 rounded-xl font-bold text-sm hover:bg-amber-600 transition">
            🖨️ Stampa Ricetta
          </button>
          <button onclick="toggleModal('view-modal'); openEditModal('${r.titolo.replace(/'/g, "\\'")}');" class="bg-amber-100 text-amber-800 px-4 py-2 rounded-xl font-bold text-sm hover:bg-amber-200 transition">
            ✏️ Modifica Ricetta
          </button>
          <button onclick="toggleModal('view-modal'); deleteRecipe('${r.titolo.replace(/'/g, "\\'")}');" class="bg-red-100 text-red-700 px-4 py-2 rounded-xl font-bold text-sm hover:bg-red-200 transition">
            🗑️ Elimina Ricetta
          </button>
        </div>
      `;
      toggleModal('view-modal');
    }

    // Apri Modal Modifica
    function openEditModal(titolo) {
      const r = allRecipes.find(item => item.titolo === titolo);
      if (!r) return;

      document.getElementById('edit-id').value = r.titolo;
      document.getElementById('edit-titolo').value = r.titolo || '';
      document.getElementById('edit-categoria').value = r.categoria || 'Antipasti e Aperitivi';
      document.getElementById('edit-tempo').value = r.tempo || '';
      document.getElementById('edit-immagine').value = r.immagine_url || '';
      document.getElementById('edit-ingredienti').value = r.ingredienti || '';
      document.getElementById('edit-preparazione').value = r.preparazione || '';
      document.getElementById('edit-note').value = r.note || '';
      document.getElementById('edit-fonte').value = r.fonte || '';

      toggleModal('edit-modal');
    }

    // Salva Modifiche
    async function updateRecipe(e) {
      e.preventDefault();
      const oldTitle = document.getElementById('edit-id').value;
      const imgUrl = await getImageUrl('edit-file-immagine', 'edit-immagine');

      const updatedRecipe = {
        titolo: document.getElementById('edit-titolo').value.trim(),
        categoria: document.getElementById('edit-categoria').value,
        tempo: document.getElementById('edit-tempo').value,
        immagine_url: imgUrl,
        ingredienti: document.getElementById('edit-ingredienti').value,
        preparazione: document.getElementById('edit-preparazione').value,
        note: document.getElementById('edit-note').value,
        fonte: document.getElementById('edit-fonte').value
      };

      const { error } = await db.from('ricette').update(updatedRecipe).eq('titolo', oldTitle);

      if (error) {
        alert("Errore durante l'aggiornamento: " + error.message);
      } else {
        toggleModal('edit-modal');
        fetchRecipes();
      }
    }

    // Elimina Ricetta
    async function deleteRecipe(titolo) {
      const confirmDelete = confirm(`Sei sicura di voler eliminare la ricetta "${titolo}"?`);
      if (!confirmDelete) return;

      const { error } = await db.from('ricette').delete().eq('titolo', titolo);

      if (error) {
        alert("Errore durante l'eliminazione: " + error.message);
      } else {
        fetchRecipes();
      }
    }

    // Funzione stampa ricetta
    function printRecipe(titolo) {
      const recipe = allRecipes.find(r => r.titolo === titolo);
      if (!recipe) {
        alert("Ricetta non trovata!");
        return;
      }

      const printWindow = window.open('', '_blank');
      printWindow.document.write(`
        <!DOCTYPE html>
        <html lang="it">
        <head>
          <meta charset="UTF-8">
          <title>${recipe.titolo} - Ricetta</title>
          <style>
            @page { margin: 15mm; }
            body { font-family: 'Helvetica Neue', Arial, sans-serif; color: #1f2937; margin: 0; padding: 20px; line-height: 1.6; }
            .header { text-align: center; border-bottom: 3px solid #f59e0b; padding-bottom: 15px; margin-bottom: 20px; }
            .title { font-size: 28px; font-weight: bold; color: #b45309; margin: 0 0 8px 0; }
            .badges { display: flex; justify-content: center; gap: 15px; font-size: 14px; color: #4b5563; font-weight: 600; }
            .badge { background: #fef3c7; color: #92400e; padding: 4px 12px; border-radius: 20px; }
            .img-container { text-align: center; margin-bottom: 25px; }
            .recipe-img { max-width: 100%; max-height: 280px; object-fit: cover; border-radius: 12px; border: 1px solid #e5e7eb; }
            .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
            .section-box { background: #fffbe3; border: 1px solid #fde68a; border-radius: 10px; padding: 15px; }
            .section-title { font-size: 16px; font-weight: bold; color: #b45309; border-bottom: 2px solid #f59e0b; padding-bottom: 4px; margin-top: 0; margin-bottom: 10px; text-transform: uppercase; }
            .content { white-space: pre-line; font-size: 14px; }
            .footer { margin-top: 30px; text-align: center; font-size: 11px; color: #9ca3af; border-top: 1px solid #e5e7eb; padding-top: 10px; }
          </style>
        </head>
        <body>
          <div class="header">
            <h1 class="title">${recipe.titolo}</h1>
            <div class="badges">
              <span class="badge">🏷️ ${recipe.categoria || 'Generale'}</span>
              ${recipe.tempo ? `<span class="badge">⏱️ ${recipe.tempo}</span>` : ''}
            </div>
          </div>

          ${recipe.immagine_url ? `
            <div class="img-container">
              <img src="${recipe.immagine_url}" class="recipe-img" alt="${recipe.titolo}">
            </div>
          ` : ''}

          <div class="grid">
            <div class="section-box">
              <h2 class="section-title">🛒 Ingredienti</h2>
              <div class="content">${recipe.ingredienti || 'Nessun ingrediente inserito.'}</div>
            </div>
            <div>
              <h2 class="section-title">👨‍🍳 Preparazione</h2>
              <div class="content">${recipe.preparazione || 'Nessun procedimento inserito.'}</div>
            </div>
          </div>

          <div class="footer">
            Stampato dal mio Ricettario Personale
          </div>
        </body>
        </html>
      `);

      printWindow.document.close();
      printWindow.focus();
      setTimeout(() => {
        printWindow.print();
      }, 300);
    }

    // Caricamento iniziale
    fetchRecipes();
  </script>
</body>
</html>
