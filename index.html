<h2 class="text-2xl font-fun text-amber-600 mb-4">Aggiungi o Importa Ricetta</h2>

  <!-- IMPORTATORE AUTOMATICO -->
  <div class="bg-amber-50 p-4 rounded-xl border border-amber-200 mb-6">
    <label class="block text-xs font-bold text-amber-800 uppercase mb-1">🔗 Incolla Link (Sito Web, Instagram, TikTok)</label>
    <div class="flex gap-2">
      <input type="url" id="import-url" placeholder="https://..." class="w-full p-2 text-sm rounded-lg border border-amber-300 focus:outline-none">
      <button onclick="importFromUrl()" class="bg-amber-500 text-white font-bold px-4 text-sm rounded-lg hover:bg-amber-600 whitespace-nowrap">Importa Dati</button>
    </div>
  </div>

  <!-- FORM MANUALE -->
  <form id="recipe-form" onsubmit="saveRecipe(event)" class="space-y-4">
    <div>
      <label class="block text-xs font-bold text-gray-600 uppercase">Titolo Ricetta *</label>
      <input type="text" id="f-titolo" required class="w-full p-2 border rounded-lg">
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-bold text-gray-600 uppercase">Categoria *</label>
        <select id="f-categoria" required class="w-full p-2 border rounded-lg bg-white">
          <option value="Antipasti e Aperitivi">Antipasti e Aperitivi</option>
          <option value="Primi Piatti">Primi Piatti</option>
          <option value="Secondi Piatti">Secondi Piatti</option>
          <option value="Pizza, Pane e Focacce">Pizza, Pane e Focacce</option>
          <option value="Dolci">Dolci</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-600 uppercase">Tempo di Preparazione</label>
        <input type="text" id="f-tempo" placeholder="es. 30 minuti" class="w-full p-2 border rounded-lg">
      </div>
    </div>
    <div>
      <label class="block text-xs font-bold text-gray-600 uppercase">URL Immagine</label>
      <input type="url" id="f-immagine" placeholder="https://..." class="w-full p-2 border rounded-lg">
    </div>
    <div>
      <label class="block text-xs font-bold text-gray-600 uppercase">Ingredienti</label>
      <textarea id="f-ingredienti" rows="3" placeholder="Un ingrediente per riga..." class="w-full p-2 border rounded-lg"></textarea>
    </div>
    <div>
      <label class="block text-xs font-bold text-gray-600 uppercase">Preparazione / Passaggi</label>
      <textarea id="f-preparazione" rows="4" placeholder="Spiega come prepararla..." class="w-full p-2 border rounded-lg"></textarea>
    </div>
    <div>
      <label class="block text-xs font-bold text-gray-600 uppercase">Note Aggiuntive</label>
      <textarea id="f-note" rows="2" placeholder="Consigli, varianti, conservazione..." class="w-full p-2 border rounded-lg"></textarea>
    </div>
    <div>
      <label class="block text-xs font-bold text-gray-600 uppercase">Fonte (Link originale)</label>
      <input type="url" id="f-fonte" placeholder="https://..." class="w-full p-2 border rounded-lg">
    </div>

    <button type="submit" class="w-full bg-amber-500 text-white font-bold py-3 rounded-xl shadow hover:bg-amber-600 transition">Salva nel Ricettario 📖</button>
  </form>
</div>


  <h2 class="text-2xl font-fun text-amber-600 mb-4">✏️ Modifica Ricetta</h2>

  <form id="edit-recipe-form" onsubmit="updateRecipe(event)" class="space-y-4">
    <input type="hidden" id="edit-id">
    <div>
      <label class="block text-xs font-bold text-gray-600 uppercase">Titolo Ricetta *</label>
      <input type="text" id="edit-titolo" required class="w-full p-2 border rounded-lg">
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-bold text-gray-600 uppercase">Categoria *</label>
        <select id="edit-categoria" required class="w-full p-2 border rounded-lg bg-white">
          <option value="Antipasti e Aperitivi">Antipasti e Aperitivi</option>
          <option value="Primi Piatti">Primi Piatti</option>
          <option value="Secondi Piatti">Secondi Piatti</option>
          <option value="Pizza, Pane e Focacce">Pizza, Pane e Focacce</option>
          <option value="Dolci">Dolci</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-600 uppercase">Tempo di Preparazione</label>
        <input type="text" id="edit-tempo" class="w-full p-2 border rounded-lg">
      </div>
    </div>
    <div>
      <label class="block text-xs font-bold text-gray-600 uppercase">URL Immagine</label>
      <input type="url" id="edit-immagine" class="w-full p-2 border rounded-lg">
    </div>
    <div>
      <label class="block text-xs font-bold text-gray-600 uppercase">Ingredienti</label>
      <textarea id="edit-ingredienti" rows="3" class="w-full p-2 border rounded-lg"></textarea>
    </div>
    <div>
      <label class="block text-xs font-bold text-gray-600 uppercase">Preparazione / Passaggi</label>
      <textarea id="edit-preparazione" rows="4" class="w-full p-2 border rounded-lg"></textarea>
    </div>
    <div>
      <label class="block text-xs font-bold text-gray-600 uppercase">Note Aggiuntive</label>
      <textarea id="edit-note" rows="2" class="w-full p-2 border rounded-lg"></textarea>
    </div>
    <div>
      <label class="block text-xs font-bold text-gray-600 uppercase">Fonte (Link originale)</label>
      <input type="url" id="edit-fonte" class="w-full p-2 border rounded-lg">
    </div>

    <button type="submit" class="w-full bg-amber-500 text-white font-bold py-3 rounded-xl shadow hover:bg-amber-600 transition">💾 Salva Modifiche</button>
  </form>
</div>


  <div id="view-content" class="space-y-6">
    <!-- Contenuto iniettato via JS -->
  </div>

  <div class="no-print mt-8 flex justify-end gap-3 border-t pt-4">
    <button onclick="window.print()" class="bg-amber-500 text-white px-6 py-2.5 rounded-xl font-bold hover:bg-amber-600">🖨️ Stampa / Salva PDF</button>
  </div>
</div>
